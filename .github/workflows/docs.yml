name: website

# build the documentation whenever there are new commits on main
on:
  push:
    branches:
      - main
    # Alternative: only build for tags.
    # tags:
    #   - '*'

# security: restrict permissions for CI jobs.
permissions:
  contents: read

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      # Install from uv.lock so the docs build sees the same dependency
      # versions as local development, including mixsea from its git source
      # ([tool.uv.sources] is ignored by pip).
      # setup-uv publishes no floating major tag, so the version is pinned in full.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      # The following is for not using the cache action, but it didn't quite work.
        # with:
        #   python-version: '3.11'
        #   cach: 'pip'
      # - run: pip install pdoc
      # - run: pip install -r requirements.txt
      # - run: pip install -e .

      - name: Build docs
        run: make ghdocs

      - name: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
